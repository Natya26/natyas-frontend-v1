<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        body {
          margin: 0;
          color: #252525;
        }
  
        .content {
          max-width: 900px;
          margin: 0 auto;
          padding: 30px 20px;
          font-family: 'Poppins', sans-serif;
          font-weight: 400;
        }
  
        .header {
          background: #fafafa;
          padding: 60px 30px;
        }
  
        strong {
          font-family: 'Poppins', sans-serif;
          font-weight: 600;
        }
  
        h4 {
          font-family: 'Poppins', sans-serif;
          font-weight: 600;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 2vw;
        }
        .plans {
            max-width: 1200px;
            height: 350px;
            margin: 0 auto;
            margin-top: 2vw;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2vw;
        }
        .plan {
            width: 400px;
            height: 100%;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background-color: #252525;
            color: #f5f5f5;
            transition: transform 0.3s ease; /* Smooth scaling */
        }
        .plan h1 {
            margin-top: 6vw;
            margin-left: 3vw;
            text-transform: capitalize;
            font-family: 'Poppins', sans-serif;
        }
        .plan h5 {
            margin-left: 3vw;
            font-weight: 200;
            color: #c8c6c6;
        }
        .price {
            margin-bottom: 20vw !important;
            margin-left: 3vw;
            font-size: 2.5vw;
            font-family: Gilroy-Regular;
        }
        .plan:hover{
            background: linear-gradient(to bottom, #e8c817, #ffde23);
            transform: scale(1.1);
        }
        .plan:hover h5{
            color: #f5f5f5;
        }
        .title {
          font-size: 22px;
          margin: 0;
        }
  
        .heading {
          background: #f5f5f5;
        }
  
        .title {
          max-width: 900px;
          margin: 0 auto;
          padding: 30px 20px;
          font-family: 'Poppins', sans-serif;
          font-weight: 400;
          text-align: center;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
      </style>
</head>
<body>
    <div class="heading">
        <div class="title">
          <h3><strong>Pricing Plans</strong></h3>
        </div>
      </div>
    <div class="content">
        <h4><strong>Choose the plans that's right for you</strong></h4>
        <div class="plans">
            <div class="plan">
                <h1>1 month</h1>
                <h5>30 days</h5>
                <h2 class="price">&#8377; 99</h2>
            </div>
            <div class="plan">
                <h1>2 months</h1>
                <h5>60 days</h5>
                <h2 class="price">&#8377; 149</h2>
            </div>
            <div class="plan">
                <h1>3 months</h1>
                <h5>90 days</h5>
                <h2 class="price">&#8377; 199</h2>
            </div>
        </div>
    </div>
</body>
</html>
